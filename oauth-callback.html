<!doctype html><html><head><meta charset="utf-8"><title>ArcGIS OAuth Callback</title><script>function loadHandler(){if(opener){if(location.hash){try{var esriId=opener.require&&opener.require("esri/kernel").id}catch(e){}if(esriId){esriId.setOAuthResponseHash(location.hash)}else{opener.dispatchEvent(new CustomEvent("arcgis:auth:hash",{detail:location.hash}))}}else if(location.search){opener.dispatchEvent(new CustomEvent("arcgis:auth:location:search",{detail:location.search}))}}close()}</script></head><body onload="loadHandler()"></body></html>
