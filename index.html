<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">

  <title>Lease Leverage Engine</title>

  <script type="module" src="https://js.arcgis.com/5.1/"></script>

  <link
    rel="stylesheet"
        href="styles.css?v=20261006-ldi-final"
  >
</head>

<body>

  <div id="app">

    <div class="toolbar">

      <div class="brand">
  LEASE LEVERAGE ENGINE
  <span
    id="scenarioTitle"
    style="
      margin-left:14px;
      color:#BDC2C7;
      font-size:13px;
      font-weight:600;
      letter-spacing:0.4px;
      white-space:nowrap;
    "
  >
    RELOCATION SCENARIO
  </span>
</div>

      <button
        id="login"
        class="primary"
      >
        SIGN IN / LOAD LIVE DATA
      </button>

      <button
        id="logout"
        hidden
      >
        SIGN OUT
      </button>

      <label for="iteration">
        Iteration
      </label>

      <select
        id="iteration"
        disabled
      >
        <option value="-1">
          — none —
        </option>
      </select>

      <label class="toggle">
        <input
          id="anno"
          type="checkbox"
          checked
        >
        annotation
      </label>

      <label class="toggle">
        <input
          id="process"
          type="checkbox"
          checked
        >
        process overlay
      </label>

      <label class="toggle">
        <input
          id="restructure"
          type="checkbox"
        >
        early restructure
      </label>

      <button
        id="clear"
        disabled
      >
        Clear
      </button>

      <span
        id="status"
        class="status"
      >
        Waiting…
      </span>

      <div
        class="savills-logo-wrap"
        aria-label="Savills"
      >
        <img
          class="savills-logo"
          src="savills-logo.jpg"
          alt="Savills"
        >
      </div>

    </div>


    <div
      id="wrap"
      class="wrap"
    >

      <div class="legend">

        <span>
          <i
            class="swatch"
            style="background:#CE181E"
          ></i>
          LANDLORD LEVERAGE
        </span>

        <span>
          <i
            class="swatch"
            style="background:#238291"
          ></i>
          TENANT LEVERAGE
        </span>

      </div>


      <svg id="chart"></svg>

<button
  id="todaysReadButton"
  type="button"
  aria-expanded="false"
  aria-controls="todaysReadPanel"
  style="position:absolute;top:12px;left:70px;z-index:20;background:#25273A;color:#FFDF00;border:1px solid #FFDF00;border-radius:5px;padding:8px 12px;font-family:Gotham,Arial,sans-serif;font-size:12px;font-weight:700;cursor:pointer;"
>
  TODAY'S READ
</button>

<div
  id="todaysReadPanel"
  hidden
  role="region"
  aria-label="Today's Read"
  style="position:absolute;top:52px;left:70px;z-index:21;width:min(440px,calc(100% - 90px));max-height:65%;overflow-y:auto;box-sizing:border-box;background:#1B1D2C;color:#FFFFFF;border:1px solid #FFDF00;border-radius:7px;padding:14px;font-family:Gotham,Arial,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.4);"
>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
    <span></span>
    <button
      id="todaysReadClose"
      type="button"
      aria-label="Close Today's Read"
      style="background:transparent;color:#FFFFFF;border:0;font-size:20px;cursor:pointer;"
    >×</button>
  </div>

  <div
    id="todaysReadContent"
    style="margin-top:12px;font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;"
  ></div>
</div>


      <div
        id="popup"
        class="annotation"
        hidden
      ></div>


      <div
        id="center"
        class="center"
      >

        <h2>
          LEASE LEVERAGE ENGINE
        </h2>

        <p id="msg">
          Protected chart data loads only after ArcGIS authentication.
        </p>

        <button
          id="centerLogin"
          class="primary"
        >
          SIGN IN / LOAD LIVE DATA
        </button>

      </div>

    </div>


        <div
      id="intelligence"
      class="live-intelligence"
      aria-label="Live Decision Intelligence"
    ></div>


    <div
      id="impact"
      class="impact"
    >

      <div class="impact-title">
        FINANCIAL IMPACT OF EXECUTION TIMING
      </div>

      <div
        id="impactDelta"
        class="impact-delta neutral"
      >
        SELECT AN ITERATION
      </div>

      <div
        id="impactNpv"
        class="impact-npv"
      >
        NPV TODAY — &nbsp;&nbsp; NPV IN EXECUTION WINDOW —
      </div>

    </div>

  </div>


  <script
    type="module"
        src="app.js?v=20261009-todays-read-final"
  ></script>

</body>
</html>
