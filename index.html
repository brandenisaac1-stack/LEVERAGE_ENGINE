<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">

  <title>Lease Leverage Engine</title>

  <script type="module" src="https://js.arcgis.com/5.1/"></script>

  <link
    rel="stylesheet"
    href="styles.css?v=20261005-savills-final"
  >
</head>

<body>

  <div id="app">

    <div class="toolbar">

      <div class="brand">
        LEASE LEVERAGE ENGINE
      </div>

      <button
        id="login"
        class="primary"
      >
        SIGN IN / LOAD LIVE DATA
      </button>

      <button
        id="logout"
        hidden
      >
        SIGN OUT
      </button>

      <label for="iteration">
        Iteration
      </label>

      <select
        id="iteration"
        disabled
      >
        <option value="-1">
          — none —
        </option>
      </select>

      <label class="toggle">
        <input
          id="anno"
          type="checkbox"
          checked
        >
        annotation
      </label>

      <label class="toggle">
        <input
          id="process"
          type="checkbox"
          checked
        >
        process overlay
      </label>

      <label class="toggle">
        <input
          id="sched"
          type="checkbox"
          checked
        >
        schedule
      </label>

      <label class="toggle">
        <input
          id="restructure"
          type="checkbox"
        >
        early restructure
      </label>

      <button
        id="clear"
        disabled
      >
        Clear
      </button>

      <span
        id="status"
        class="status"
      >
        Waiting…
      </span>

      <div
        class="savills-logo-wrap"
        aria-label="Savills"
      >
        <img
          class="savills-logo"
          src="Savills-logo.png"
          alt="Savills"
        >
      </div>

    </div>


    <div
      id="wrap"
      class="wrap"
    >

      <div class="legend">

        <span>
          <i
            class="swatch"
            style="background:#CE181E"
          ></i>
          LANDLORD LEVERAGE
        </span>

        <span>
          <i
            class="swatch"
            style="background:#238291"
          ></i>
          TENANT LEVERAGE
        </span>

      </div>


      <svg id="chart"></svg>


      <div
        id="popup"
        class="annotation"
        hidden
      ></div>


      <div
        id="center"
        class="center"
      >

        <h2>
          LEASE LEVERAGE ENGINE
        </h2>

        <p id="msg">
          Protected chart data loads only after ArcGIS authentication.
        </p>

        <button
          id="centerLogin"
          class="primary"
        >
          SIGN IN / LOAD LIVE DATA
        </button>

      </div>

    </div>


    <div
      id="schedule"
      class="schedule"
    ></div>


    <div
      id="impact"
      class="impact"
    >

      <div class="impact-title">
        FINANCIAL IMPACT OF EXECUTION TIMING
      </div>

      <div
        id="impactDelta"
        class="impact-delta neutral"
      >
        SELECT AN ITERATION
      </div>

      <div
        id="impactNpv"
        class="impact-npv"
      >
        NPV TODAY — &nbsp;&nbsp; NPV IN EXECUTION WINDOW —
      </div>

    </div>

  </div>


  <script
    type="module"
    src="app.js?v=20261005-savills-final"
  ></script>

</body>
</html>
